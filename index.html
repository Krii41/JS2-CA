<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover posts, share moments, and connect with otherson soSocial.">
    <meta name="author" content="Urve Kriiva">
    <script src="https://kit.fontawesome.com/63d815684c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Home | soSocial</title>
</head>

<body>
    <header>
        <div class="logo">soSocial.</div>
        <nav>
            <div class="search">
                <input type="search" id="search-input" placeholder="Search posts..." aria-label="Search posts">
                <button type="button" class="search-toggle" aria-label="Open search" aria-expanded="false"
                    aria-controls="search-input">
                    <i class="fa-vellum fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <a href="./index.html" aria-label="Go to feed"><i class="fa-vellum fa-solid fa-house"></i></a>
            <a href="login/index.html" id="login-link" aria-label="Log in">
                <i class="fa-vellum fa-solid fa-circle-user"></i>
            </a>
            <a href="profile/index.html" aria-label="View profile" id="profile-link"  hidden>
                <i class="fa-vellum fa-solid fa-user"></i>
            </a>
            <button type="button" class="logout-btn" id="logout-btn" aria-label="Log out" hidden>
                <i class="fa-vellum fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </nav>
    </header>
    <main>
        <h1>Feed</h1>
        <section class="create-post" hidden>
            <div class="post-header">
                <div class="avatar">
                    <img src="assets/images/avatar.png" alt="Avatar image">
                </div>
                <div class="post-author">
                    <h4>Johnny</h4>
                    <span class="post-date">04.11.2026</span>
                </div>
            </div>
            <form class="new-post-form">
                <label for="post-image" class="visually-hidden">Post URL</label>
                <input type="url" id="post-image" name="media" placeholder="https://example.com/image.jpg" />
                <label for="post-title" class="visually-hidden">Title</label>
                <input type="text" id="post-title" name="title" placeholder="Maybe title..." aria-label="Write a title">
                <label for="post-body" class="visually-hidden">Post content</label>
                <textarea id="post-body" name="body" placeholder="What's on your mind?" rows="4"></textarea>
                <button type="submit" class="post-btn">Post</button>
            </form>
        </section>
        <section class="posts-container" id="posts-container"></section>
    </main>
    <footer>
        <div class="footer-slogan">
            <i class="fa-vellum fa-solid fa-mug"></i>
            <span>Time to take a break.</span>
        </div>
        <div class="copyright">&copy; 2026 soSocial.</div>
    </footer>
    <script type="module" src="js/pages/feed.js"></script>
</body>

</html>
