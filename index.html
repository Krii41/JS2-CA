<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover posts, share moments, and connect with otherson soSocial.">
    <meta name="author" content="Urve Kriiva">
    <script src="https://kit.fontawesome.com/63d815684c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Home | soSocial</title>
</head>

<body>
    <header>
        <div class="logo">soSocial.</div>
        <nav>
            <div class="search">
                <input 
                type="search"
                id="search-input"
                placeholder="Search posts..."
                aria-label="Search posts"
                >
                <button
                type="button"
                class="search-toggle"
                aria-label="Open search"
                aria-expanded="false"
                aria-controls="search-input"
                >
                <i class="fa-vellum fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <a href="./index.html"><i class="fa-vellum fa-solid fa-house"></i></a>
            <a href="login/index.html" id="login-link">
                <i class="fa-vellum fa-solid fa-circle-user"></i>
            </a>
            <a href="profile/index.html" id="profile-link" hidden>
                <i class="fa-vellum fa-solid fa-user"></i>
            </a>
            <button type="button" class="logout-btn" id="logout-btn" hidden>
                <i class="fa-vellum fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </nav>
    </header>

    <main>
        <h1>Feed</h1>

        <section class="create-post">
            <div class="post-header">
                <div class="avatar">
                    <img src="assets/images/avatar.png" alt="">
                </div>
                <div class="post-author">
                    <h4>Johnny</h4>
                    <span class="post-date">04.11.2026</span>
                </div>
            </div>
            <form class="new-post-form">
                <label for="post-title"></label>
                <input type="text" id="post-title" name="title" placeholder="Maybe title..." aria-label="Write a title">
                <label for="post-pody"></label>
                <textarea id="post-body" name="body" placeholder="What's on your mind?" rows="4"></textarea>
            </form>
            </form>

            <button class="post-btn">Post</button>
        </section>

       <section class="posts-container">
        <div class="post-container">
            <div class="post-header">
                <div class="avatar">
                    <img src="assets/images/avatar.png" alt="">
                </div>
                <div class="post-author">
                    <h4>Jane</h4>
                    <span class="post-date">04.11.2026</span>
                </div>

                <button class="delete-post">Delete</button>
            </div>
            <div class="post-content">
                <div class="post-img">
                    <img src="assets/images/robot.jpg" alt="Robot performing ordinary human job.">
                </div>
                <h4 class="post-title">This is how I spend my afternoon</h4>
                <p>I am not a robot. Ha ha haa..😅</p>
            </div>
            <div class="post-actions">
                <div class="post-actions-left">
                    <a href="post/index.html" class="view-post">
                        <img src="assets/icon/eye.png" alt="">
                    </a>
                    <button type="button" class="edit-btn">
                        <img src="assets/icon/edit.png" alt="">
                    </button>
                </div>
                <div class="post-actions-right">
                    <button type="button" class="like-btn">
                        <img src="assets/icon/heart.png" alt="">
                        <p class="action-count-like">105</p>
                    </button>
                    <button type="button" class="comment-btn">
                        <img src="assets/icon/comment.png" alt="">
                        <p class="action-count-comment">105</p>
                    </button>
                </div>
            </div>
            <div class="comment-post" hidden>
                <form class="write-comment">
                    <input type="text" name="comment" placeholder="Write a comment..." aria-label="Write a comment">

                </form>
                <button class="post-btn">Post</button>
            </div>
        </div>
        <div class="post-container">
            <div class="post-header">
                <div class="avatar">
                    <img src="assets/images/avatar.png" alt="">
                </div>
                <div class="post-author">
                    <h4>Jane</h4>
                    <span class="post-date">04.11.2026</span>
                </div>

                <button class="delete-post">Delete</button>
            </div>
            <div class="post-content">
                <div class="post-img">
                    <img src="assets/images/painting.jpg" alt="Robot performing ordinary human job.">
                </div>
                <h4 class="post-title">Something colorful</h4>
                <p>Still not a robot. Ha ha haa..😅</p>
            </div>
            <div class="post-actions">
                <div class="post-actions-left">
                    <a href="post/index.html" class="view-post">
                        <img src="assets/icon/eye.png" alt="">
                    </a>
                    <button type="button" class="edit-btn">
                        <img src="assets/icon/edit.png" alt="">
                    </button>
                </div>
                <div class="post-actions-right">
                    <button type="button" class="like-btn">
                        <img src="assets/icon/heart.png" alt="">
                        <p class="action-count-like">105</p>
                    </button>
                    <button type="button" class="comment-btn">
                        <img src="assets/icon/comment.png" alt="">
                        <p class="action-count-comment">105</p>
                    </button>
                </div>
            </div>
            <div class="comment-post" hidden>
                <form class="write-comment">
                    <input type="text" name="comment" placeholder="Write a comment..." aria-label="Write a comment">

                </form>
                <button class="post-btn">Post</button>
            </div>
        </div>
       </section>

    </main>

    <footer>
        <div class="footer-slogan">
            <i class="fa-vellum fa-solid fa-mug"></i>
            <span>Time to take a break.</span>
        </div>
        <div class="copyright">&copy; 2026 soSocial.</div>
    </footer>
    <script type="module" src="js/pages/feed.js"></script>
</body>

</html>
