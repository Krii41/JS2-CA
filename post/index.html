<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read posts, explore reactions, and join the conversations on soSocial.">
    <meta name="author" content="Urve Kriiva">
    <script src="https://kit.fontawesome.com/63d815684c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/style.css">
    <title>Post | soSocial</title>
</head>

<body>
    <header>
        <div class="logo">soSocial.</div>
        <nav>
            <div class="search">
                <input 
                type="search"
                id="search-input"
                placeholder="Search posts..."
                aria-label="Search posts"
                >
                <button
                type="button"
                class="search-toggle"
                aria-label="Open search"
                aria-expanded="false"
                aria-controls="search-input"
                >
                <i class="fa-vellum fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <a href="../index.html"><i class="fa-vellum fa-solid fa-house"></i></a>
            <a href="../login/index.html" id="login-link">
                <i class="fa-vellum fa-solid fa-circle-user"></i>
            </a>
            <a href="../profile/index.html" id="profile-link" hidden>
                <i class="fa-vellum fa-solid fa-user"></i>
            </a>
            <button type="button" class="logout-btn" id="logout-btn" hidden>
                <i class="fa-vellum fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </nav>
    </header>

    <main>
        <div class="return-container">
            <a href="../index.html" class="return-to-feed">
                <i class="fa-vellum fa-solid fa-arrow-left fa-width-auto"></i>
                <p>Back to Feed</p>
            </a>
        </div>
        
        <div id="single-post-container"></div>
            <span class="comments-title">Comments</span>

            

            <p class="no-comments" hidden>It's a little quiet here... Be the first to comment!</p>
            <section class="comments-list">

                <form id="comment-form" class="comment-form">
                    <label for="comment-body">Write a comment</label>
                    <textarea
                      id="comment-body"
                      name="body"
                      placeholder="Write your comment..."
                      required
                    ></textarea>
                  
                    <button type="submit" class="comment-btn">Comment</button>
                  </form>
                
            </section>
    </main>

    <footer>
        <div class="footer-slogan">
            <i class="fa-vellum fa-solid fa-mug"></i>
            <span>Time to take a break.</span>
        </div>
        <div class="copyright">&copy; 2026 soSocial.</div>
    </footer>
    <script type="module" src="../js/pages/post.js"></script>
</body>

</html>
