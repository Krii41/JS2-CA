<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View posts, followers, and profile information on soSocial.">
    <meta name="author" content="Urve Kriiva">
    <script src="https://kit.fontawesome.com/63d815684c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/style.css">
    <title>Profile | soSocial</title>
</head>

<body>
    <header>
        <div class="logo">soSocial.</div>
        <nav>
            <div class="search">
                <input 
                type="search"
                id="search-input"
                placeholder="Search posts..."
                aria-label="Search posts"
                >
                <button
                type="button"
                class="search-toggle"
                aria-label="Open search"
                aria-expanded="false"
                aria-controls="search-input"
                >
                <i class="fa-vellum fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <a href="../index.html"><i class="fa-vellum fa-solid fa-house"></i></a>
            <a href="../login/index.html" id="login-link">
                <i class="fa-vellum fa-solid fa-circle-user"></i>
            </a>
            <a href="../profile/index.html" id="profile-link" hidden>
                <i class="fa-vellum fa-solid fa-user"></i>
            </a>
            <button type="button" class="logout-btn" id="logout-btn" hidden>
                <i class="fa-vellum fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </nav>
    </header>

    <main>
        <div class="return-container">
            <a href="../index.html" class="return-to-feed">
                <i class="fa-vellum fa-solid fa-arrow-left fa-width-auto"></i>
                <p>Back to Feed</p>
            </a>
        </div>
        <div class="profile-header">
            <h1>My Profile</h1>
            <div>
                <button class="follow-btn">Follow</button>
            </div>
        </div>
        <section class="profile-info">
            <div class="user-profile">
              <div class="avatar profile">
                <img src="../assets/images/smile.png" alt="">
              </div>
              <h2></h2>
              <p></p>
            </div>

            <div class="profile-status">
                <div class="posts-count">
                    <span class="stat-number"></span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="followers-count">
                    <span class="stat-number"></span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="following-count">
                    <span class="stat-number"></span>
                    <span class="stat-label">Following</span>
                </div>
            </div>
        </section>

        <section class="posts-container">
            
        </section>

    </main>

    <footer>
        <div class="footer-slogan">
            <i class="fa-vellum fa-solid fa-mug"></i>
            <span>Time to take a break.</span>
        </div>
        <div class="copyright">&copy; 2026 soSocial.</div>
    </footer>
    <script type="module" src="../js/pages/profile.js"></script>
</body>

</html>
