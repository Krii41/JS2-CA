<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your soSocial account to connect and share with others.">
    <meta name="author" content="Urve Kriiva">
    <script src="https://kit.fontawesome.com/63d815684c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/style.css">
    <title>Login | soSocial</title>
</head>
<body>
    <header>
        <div class="logo">soSocial.</div>
        <nav>
            <div class="search">
                <input 
                type="search"
                id="search-input"
                placeholder="Search posts..."
                aria-label="Search posts"
                >
                <button
                type="button"
                class="search-toggle"
                aria-label="Open search"
                aria-expanded="false"
                aria-controls="search-input"
                >
                <i class="fa-vellum fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <a href="../index.html"><i class="fa-vellum fa-solid fa-house"></i></a>
            <a href="../login/index.html" id="login-link">
                <i class="fa-vellum fa-solid fa-circle-user"></i>
            </a>
            <a href="../profile/index.html" id="profile-link" hidden>
                <i class="fa-vellum fa-solid fa-user"></i>
            </a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h1>Login</h1>
            <form id="register-form">
                <label for="email">E-mail</label>
                <input type="text" id="email" name="email" placeholder="example@gmail.com" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="password" required>
                <button type="submit" class="form-btn" id="form-btn" aria-label="Login">Login</button>   
            </form>
            <p class="page-switch">New around here?
                <a href="../register/index.html" class="link-btn">Join us</a>
            </p>
        </div>
    </main>

    <footer>
        <div class="footer-slogan">
            <i class="fa-vellum fa-solid fa-mug"></i>
            <span>Time to take a break.</span>
        </div>
        <div class="copyright">&copy; 2026 soSocial.</div>
    </footer>
</body>
</html>
